name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Weekly, so the coverage metric tracks mathlib rather than going stale.
    - cron: "17 6 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  typescript:
    name: TypeScript (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Unit and integration tests
        run: pnpm run test

      - name: Build the web application
        run: pnpm --filter @prooflens/web build

      - name: Typecheck the infoview widget
        run: npx tsc --noEmit -p lean/widget/tsconfig.json

      - name: The committed widget bundle must be current
        run: |
          pnpm run build:widget
          if ! git diff --quiet -- lean/ProofLens/Widget/prooflens.js; then
            echo "::error::lean/ProofLens/Widget/prooflens.js is stale."
            echo "Run \`pnpm build:widget\` and commit the result."
            git --no-pager diff --stat -- lean/ProofLens/Widget/prooflens.js
            exit 1
          fi

  lean-core:
    name: Lean core (no mathlib)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain "$(cat lean/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # The ProofLens extractor depends on Lean core only, so that it can be
      # pointed at any Lean project. This job exists to keep that true: if a
      # mathlib import ever creeps into `lean/`, it fails here.
      - name: Build the extractor
        working-directory: lean
        run: lake build

  lean-corpus-e2e:
    name: Lean corpus and end-to-end pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install elan
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain "$(cat lean/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache mathlib build artifacts
        uses: actions/cache@v4
        with:
          path: corpus/.lake/packages
          key: mathlib-${{ hashFiles('corpus/lake-manifest.json') }}

      - name: Fetch the mathlib cache
        working-directory: corpus
        run: |
          lake update -R
          lake exe cache get

      # Jobs do not share build artifacts. The corpus target itself does not
      # import ProofLens, but the generated extraction driver does.
      - name: Build the extractor for this job
        working-directory: lean
        run: lake build

      - name: Build the example corpus and TorchLean certificate
        working-directory: corpus
        run: lake build ProofLensExamples ProofLensExamples.TorchLeanDigits

      - name: The corpus must be free of `sorry`
        run: |
          if grep -rn --include=*.lean '\bsorry\b' corpus/ProofLensExamples/; then
            echo "::error::The example corpus contains `sorry`."
            exit 1
          fi

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

      # Extraction runs through Lean's own frontend (see ADR 0001), which is the
      # only path guaranteed to produce full notation fidelity.
      - name: Extract Formal IR from the corpus
        run: |
          node packages/cli/dist/bin.js extract \
            --project corpus \
            --module ProofLensExamples.Bounds \
            --module ProofLensExamples.Monotonicity \
            --module ProofLensExamples.Implication \
            --module ProofLensExamples.DependencyChain \
            --module ProofLensExamples.IntelligenceBound \
            --out /tmp/ci.formal-ir.json

          node packages/cli/dist/bin.js extract \
            --project corpus \
            --module ProofLensExamples.TorchLeanDigits \
            --out /tmp/ci.torchlean.formal-ir.json

      - name: The extraction must not be degraded
        run: |
          FIDELITY=$(node -e "console.log(JSON.parse(require('fs').readFileSync('/tmp/ci.formal-ir.json','utf8')).notationFidelity)")
          echo "notationFidelity: $FIDELITY"
          test "$FIDELITY" = "notation"

      - name: Run the full pipeline and render every figure
        run: |
          node packages/cli/dist/bin.js summary /tmp/ci.formal-ir.json
          node packages/cli/dist/bin.js render /tmp/ci.formal-ir.json --out-dir /tmp/figures --format both
          ls /tmp/figures | head -20

      # The checked-in Formal IR is what the tests and the web application read.
      # If a change to the Lean side alters it, that has to be visible in review.
      - name: The committed Formal IR must match a fresh extraction
        run: |
          node -e "
            const fs = require('node:fs');
            const strip = (p) => { const d = JSON.parse(fs.readFileSync(p,'utf8')); delete d.toolchain; return JSON.stringify(d); };
            if (strip('/tmp/ci.formal-ir.json') !== strip('examples/corpus.formal-ir.json')) {
              console.error('examples/corpus.formal-ir.json is stale. Re-extract and commit it.');
              process.exit(1);
            }
            if (strip('/tmp/ci.torchlean.formal-ir.json') !== strip('examples/torchlean-digits-enclosure.formal-ir.json')) {
              console.error('examples/torchlean-digits-enclosure.formal-ir.json is stale. Re-extract and commit it.');
              process.exit(1);
            }
            console.log('Committed Formal IR matches a fresh extraction.');
          "

      - name: The Lean widget must elaborate
        working-directory: corpus
        run: |
          cat > /tmp/widget-check.lean <<'EOF'
          import ProofLens.Widget
          import ProofLensExamples.Bounds
          #prooflens ProofLens.Examples.simple_upper_bound
          EOF
          lake env lean /tmp/widget-check.lean

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prooflens-figures
          path: /tmp/figures

  # Coverage against real mathlib is a tracked metric, not a gate. It runs on a
  # schedule and on demand rather than on every pull request: it needs a mathlib
  # build, and the number legitimately moves when mathlib does. Failing a PR
  # because upstream renamed a lemma would be noise.
  mathlib-coverage:
    name: Coverage against mathlib (metric)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install elan
        run: |
          curl -sSfL https://elan.lean-lang.org/elan-init.sh -o elan-init.sh
          sh elan-init.sh -y --default-toolchain "$(cat lean/lean-toolchain)"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      - name: Cache mathlib build artifacts
        uses: actions/cache@v4
        with:
          path: corpus/.lake/packages
          key: mathlib-${{ hashFiles('corpus/lake-manifest.json') }}

      - name: Fetch the mathlib cache
        working-directory: corpus
        run: |
          lake update -R
          lake exe cache get

      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - working-directory: lean
        run: lake build

      - name: Extract the measured mathlib slice
        run: |
          node packages/cli/dist/bin.js extract \
            --project corpus \
            --module Mathlib.Order.Monotone.Basic \
            --module Mathlib.Algebra.Order.Field.Basic \
            --module Mathlib.Analysis.SpecialFunctions.Log.Basic \
            --module Mathlib.Analysis.MeanInequalities \
            --module Mathlib.Analysis.SpecificLimits.Basic \
            --module Mathlib.Data.Real.Sqrt \
            --module Mathlib.Analysis.SpecialFunctions.BinaryEntropy \
            --out /tmp/mathlib-slice.json

      - name: Report coverage
        run: |
          node --max-old-space-size=6144 packages/cli/dist/bin.js coverage /tmp/mathlib-slice.json
          node --max-old-space-size=6144 packages/cli/dist/bin.js coverage /tmp/mathlib-slice.json \
            --format markdown --out /tmp/coverage.md
          node --max-old-space-size=6144 packages/cli/dist/bin.js coverage /tmp/mathlib-slice.json \
            --format json --out /tmp/coverage.json
          {
            echo "## ProofLens coverage against mathlib"
            echo
            sed -n '1,40p' /tmp/coverage.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Every planned figure must render
        run: |
          node --max-old-space-size=6144 --input-type=module -e "
            import {readFileSync} from 'node:fs';
            import {runPipelineOnJson} from './packages/pipeline/dist/index.js';
            import {renderSvg} from './packages/renderer-svg/dist/index.js';
            import {renderText} from './packages/renderer-text/dist/index.js';
            const b = runPipelineOnJson(readFileSync('/tmp/mathlib-slice.json','utf8'));
            let n = 0;
            for (const a of b.analyses) for (const v of a.visuals) {
              if (!renderSvg(v, {theme:'auto'}).startsWith('<svg')) throw new Error('bad svg: ' + v.id);
              if (renderText(v).length < 10) throw new Error('bad text: ' + v.id);
              const ids = new Set(v.entities.map(e => e.id));
              for (const r of v.relationships) {
                if (!ids.has(r.from) || !ids.has(r.to)) throw new Error('dangling edge in ' + v.id);
              }
              n += 1;
            }
            console.log('rendered ' + n + ' figures, no failures');
          "

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mathlib-coverage
          path: |
            /tmp/coverage.md
            /tmp/coverage.json
